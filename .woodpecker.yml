steps:
  - name: publish-pypi
    image: python:3.12
    commands:
      - pip install poetry
      - poetry install --no-interaction
      - poetry build
      - pip install twine
      - twine upload dist/* -u __token__ -p $$PYPI_TOKEN
    environment:
      PYPI_TOKEN:
        from_secret: pypi_token
    when:
      event: tag
  - name: docs
    image: python:3.12
    commands:
      - pip install poetry
      - poetry install --no-interaction --only main,docs
      - git fetch --unshallow || true # full history: sitemap lastmod comes from git
      - poetry run mkdocs build --strict
      - |
        apt-get update && apt-get install -y git
        cd site
        git init
        git checkout -b pages
        echo "docs.colorgen.piotrkrzysztof.dev" > .domains
        git add .
        git config user.email "ci@woodpecker"
        git config user.name "Woodpecker CI"
        git commit -m "Deploy docs"
        git remote add origin https://$$CODEBERG_TOKEN@codeberg.org/piotrkrzysztof/colorgen.git
        git push -f origin pages
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    when:
      event: push
      branch: master
  - name: indexnow
    image: python:3.12
    failure: ignore
    commands:
      - |
        HOST=docs.colorgen.piotrkrzysztof.dev
        KEY=90d810c25c630c45122515d81f668d80
        urls=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed 's/<[^>]*>//g' | sed 's/.*/"&"/' | paste -sd, -)
        sleep 45
        curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "{\"host\":\"$$HOST\",\"key\":\"$$KEY\",\"keyLocation\":\"https://$$HOST/$$KEY.txt\",\"urlList\":[$$urls]}" -o /dev/null -w "indexnow: HTTP %{http_code}\n"
    when:
      event: push
      branch: master
